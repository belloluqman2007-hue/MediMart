# Build the real MediMart Android APK, install it in an emulator, launch it, and exercise the
# device pairing + offline synchronization HTTP contract against a running MediMart server.
#
# A shop that cannot reach the internet can still build the APK on a computer with the Android SDK
# (`node scripts/build-apk.mjs --profile debug`). This workflow is the CI build path: it compiles
# the checked-in Capacitor project, verifies the package identity and permissions from the APK
# itself, then installs and starts that exact APK on an emulator.
name: Android build, install and run
concurrency:
  # A superseded run must never keep holding this pull request open with its emulator jobs.
  group: android-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
    branches: [main, 'arena/**']
    paths:
      - 'apps/web/android/**'
      - 'apps/web/src/**'
      - 'apps/web/capacitor.config.ts'
      - 'apps/api/**'
      - 'packages/**'
      - 'scripts/build-apk.mjs'
      - 'scripts/sync-android.mjs'
      - 'scripts/android-emulator.sh'
      - 'scripts/test-android-pairing.ts'
      - '.github/workflows/android.yml'
      - '.github/workflows/android.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Make the Gradle wrapper executable
        run: chmod +x apps/web/android/gradlew
      - run: npm ci --no-audit --no-fund

      # Debug profile on purpose: this is the build a shop can install and evaluate. HTTP on a
      # private LAN is allowed in exactly this profile (see apps/web/capacitor.config.ts).
      - name: Build the installable debug APK
        run: |
          set -o pipefail
          node scripts/build-apk.mjs --profile debug 2>&1 | tee gradle-build.log

      - name: Verify the APK identity, permissions and contents
        run: |
          set -euo pipefail
          APK=dist/android/medimart-debug.apk
          test -f "$APK"
          A="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          "$A" manifest application-id "$APK" | tee /tmp/appid.txt
          grep -Fx com.medimart.app /tmp/appid.txt
          "$A" manifest print "$APK" > /tmp/manifest.xml
          cat /tmp/manifest.xml
          grep -q 'android.permission.CAMERA' /tmp/manifest.xml
          grep -q 'android.hardware.camera' /tmp/manifest.xml
          grep -q 'android:required="false"' /tmp/manifest.xml
          grep -q 'android:name="com.medimart.app.MainActivity"' /tmp/manifest.xml
          if grep -q 'ACCESS_FINE_LOCATION\|READ_CONTACTS\|READ_SMS\|READ_EXTERNAL_STORAGE' /tmp/manifest.xml; then
            echo "Unexpected permission in the APK" >&2; exit 1
          fi
          # The packaged web application must contain the real shell and the native database code.
          unzip -l "$APK" | grep -q 'assets/public/index.html'
          unzip -l "$APK" | grep -q 'assets/capacitor.config.json'
          unzip -p "$APK" assets/capacitor.config.json | grep -q '"appId": "com.medimart.app"'
          if unzip -l "$APK" | grep -iE '\.env|keystore|\.jks|\.p12|id_rsa'; then
            echo "Secret-shaped file inside the APK" >&2; exit 1
          fi
          if unzip -p "$APK" assets/public/config.json 2>/dev/null | grep -iE 'bootstrap_token|setup_token'; then
            echo "A setup token leaked into the APK" >&2; exit 1
          fi
          # The version a shop owner reads on the phone (Settings → Apps → MediMart) must identify
          # this build. It is compared with the root package version, the single source of truth,
          # so the artifact cannot drift from what the failure screen reports.
          EXPECTED_VERSION="$(node -p "require('./package.json').version")"
          "$A" manifest version-name "$APK" | tee /tmp/version-name.txt
          grep -Fx "$EXPECTED_VERSION" /tmp/version-name.txt
          "$A" manifest version-code "$APK" | tee /tmp/version-code.txt
          grep -Eq '^[0-9]+$' /tmp/version-code.txt
          # The bundle inside the APK must carry this commit's stamp (apps/web/vite.config.ts).
          # This is the proof that the uploaded artifact is the code of this run — the question
          # "which APK did I install?" was previously unanswerable from the phone.
          SHORT_SHA="$(git rev-parse --short=8 HEAD)"
          echo "expecting build stamp for commit ${SHORT_SHA} in the packaged bundle"
          # Extracted to a file first: `grep -q` in a pipeline closes the pipe early, unzip then dies
          # with SIGPIPE (141), and `pipefail` would report a healthy APK as a failed check.
          unzip -p "$APK" 'assets/public/assets/*.js' > /tmp/bundle.js
          grep -qF "$SHORT_SHA" /tmp/bundle.js
          # Android 7.0 (API 24) must still be installable: read the floor from the APK itself.
          "$A" manifest min-sdk "$APK" | tee /tmp/minsdk.txt
          grep -Fx 24 /tmp/minsdk.txt
          echo "APK verified: $(stat -c%s "$APK") bytes"

      # The APK is the deliverable and is uploaded before anything optional runs, so a problem with
      # the on-device test harness can never withhold an installable application.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MediMart-Android
          path: dist/android/medimart-debug.apk
          retention-days: 30

      # The instrumentation harness (identity/label/backup-flag checks) is compiled so
      # `connectedDebugAndroidTest` can run against a connected phone without a rebuild. It is
      # best-effort for CI: the emulator job below is what proves install-and-launch, and a harness
      # problem must not hide that evidence. Failures are reported as annotations.
      - name: Compile the device-side test harness (best effort)
        id: harness
        continue-on-error: true
        working-directory: apps/web/android
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebugAndroidTest --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"

      - name: Report harness problems as annotations
        if: steps.harness.outcome == 'failure'
        run: |
          echo "::warning title=Instrumentation harness did not compile::The APK itself built and verified; only the on-device test harness failed. See the reported source line."
          grep -E "^(e: |.*\.java:[0-9]+: error:|.*: error:|.*> Could not resolve)" gradle-build.log | head -3 | while IFS= read -r line; do
            echo "::warning title=Harness compile error::${line//%/%%}"
          done
          tail -60 gradle-build.log

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-build-evidence
          path: |
            apps/web/android/app/build/outputs/apk/debug/
            apps/web/android/app/build/outputs/apk/androidTest/debug/
            apps/web/android/app/build/reports/
            gradle-build.log
          if-no-files-found: warn
          retention-days: 14

  device:
    # Install that exact APK on a real Android runtime, launch it, then drive the pairing and
    # offline-sync HTTP contract the phone uses, with a live MediMart server.
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: MediMart-Android
          path: apk
      - name: Install dependencies and build the server the pairing test talks to
        run: |
          npm ci --no-audit --no-fund
          npm run build

      # The API 30 image is the one GitHub's runner provisions and boots reliably. The application
      # declares minSdk 24 (Android 7.0); that floor is asserted from the APK in the `apk` job above,
      # and the Android 8.1 launch is covered by the best-effort job at the end of this workflow.
      - name: Install and launch the APK in an emulator
        env:
          APK_PATH: apk/medimart-debug.apk
        run: bash scripts/android-emulator.sh 30 evidence http://10.0.2.2:4191

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: MediMart-Android-device-evidence
          path: evidence/
          retention-days: 30

  older-android:
    # Best effort, on purpose: this proves the APK installs and launches on Android 8.1 (API 27), two
    # release levels above the declared minSdk 24. The main device job is the required evidence, so a
    # missing system image here is reported as a warning and not mistaken for a broken application.
    needs: apk
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: MediMart-Android
          path: apk
      - name: Install and launch the APK on Android 8.1
        env:
          APK_PATH: apk/medimart-debug.apk
        run: bash scripts/android-emulator.sh 27 evidence-android81
