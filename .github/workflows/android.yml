name: Android debug verification (manual)
# A shop that cannot reach the internet can still build the APK on a computer with the Android SDK
# (`node scripts/build-apk.mjs --profile debug`). This workflow is for building it in CI instead.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/web/android/**'
      - 'apps/web/src/**'
      - '.github/workflows/android.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: npm ci
      - run: npm run android:sync
      - name: Install the target SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Compile the debug application and device-test harness
        working-directory: apps/web/android
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Confirm the camera permission is declared and optional
        working-directory: apps/web/android
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print \
            app/build/outputs/apk/debug/app-debug.apk > /tmp/manifest.xml
          grep -q 'android.permission.CAMERA' /tmp/manifest.xml
          grep -q 'android.hardware.camera' /tmp/manifest.xml
          grep -q 'android:required="false"' /tmp/manifest.xml
          ! grep -q 'ACCESS_FINE_LOCATION\|READ_CONTACTS\|READ_SMS' /tmp/manifest.xml
      - name: Verify the package identifier
        working-directory: apps/web/android
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest application-id app/build/outputs/apk/debug/app-debug.apk | grep -Fx com.medimart.app
      - name: Verify version, label and that no secrets are embedded
        working-directory: apps/web/android
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          A="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          "$A" manifest print "$APK" | grep -q 'android:label="@string/app_name"'
          grep -Fx 'MediMart' app/src/main/res/values/strings.xml -r | grep -q app_name
          "$A" manifest version-name "$APK" | grep -E '^0\.[0-9]+\.[0-9]+$'
          "$A" manifest version-code "$APK" | grep -E '^[0-9]+$'
          # No development secrets: the .env file and any keystore must never be packaged.
          unzip -l "$APK" | grep -iE '\.env|keystore|\.jks|\.p12|id_rsa' && exit 1 || true
          unzip -p "$APK" assets/public/config.json 2>/dev/null | grep -iE 'bootstrap_token|setup_token' && exit 1 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: medimart-debug-unreleased
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  emulator:
    # Install and launch the built APK in an Android emulator, then capture the screen.
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: medimart-debug-unreleased
          path: apk
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          emulator-boot-timeout: 900
          disable-animations: true
          script: |
            adb install -r apk/app-debug.apk
            adb shell pm list packages | grep -Fx 'package:com.medimart.app'
            adb shell dumpsys package com.medimart.app | grep -E 'versionName|versionCode' | head -4
            mkdir -p screenshots
            adb shell am start -W -n com.medimart.app/com.medimart.app.MainActivity
            sleep 25
            adb exec-out screencap -p > screenshots/android-launch.png
            adb shell dumpsys package com.medimart.app > screenshots/android-package.txt
            adb logcat -d > screenshots/android-logcat.txt || true
            test -s screenshots/android-launch.png
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: medimart-android-emulator-screenshots
          path: screenshots/
          retention-days: 30
