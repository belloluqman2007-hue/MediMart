# Build the Windows desktop application on a real Windows runner and smoke-test it.
# The packaged server runs under the Electron runtime, so its native modules must be compiled on
# Windows for Electron's ABI. This workflow is the genuine build path; `npm run desktop:build` on a
# non-Windows machine refuses for the same reason.
name: Windows desktop application
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'apps/api/**'
      - 'apps/web/src/**'
      - 'packages/**'
      - 'scripts/build-desktop.mjs'
      - '.github/workflows/desktop.yml'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Typecheck, lint and the full test suite on Windows
        run: |
          npm run typecheck
          npm run lint
          npm test
      - name: Production build and smoke test
        run: |
          npm run build
          npm run test:production
      - name: Browser end-to-end tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Package the desktop application (native modules rebuilt for Electron)
        run: node scripts/build-desktop.mjs
      - name: Packaged smoke test — the exact runtime path (ELECTRON_RUN_AS_NODE)
        shell: pwsh
        run: |
          $pkg = "dist/desktop/MediMart-win32-x64"
          $env:ELECTRON_RUN_AS_NODE = "1"
          $env:NODE_ENV = "production"
          $env:API_HOST = "127.0.0.1"
          $env:API_PORT = "4791"
          $env:DATABASE_PATH = "$env:RUNNER_TEMP\smoke\data\medimart.sqlite"
          $env:BACKUP_DIR = "$env:RUNNER_TEMP\smoke\backups"
          $env:BOOTSTRAP_TOKEN = ("f" * 64)
          $env:COOKIE_SECURE = "false"
          $env:MEDIMART_MANAGED_DESKTOP = "true"
          $env:MEDIMART_ALLOW_LAN_HTTP = "true"
          $env:ALLOWED_ORIGINS = "http://127.0.0.1:4791"
          $env:DESKTOP_ALLOWED_ORIGINS = "http://127.0.0.1:4791"
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\smoke\data", "$env:RUNNER_TEMP\smoke\backups" | Out-Null
          $proc = Start-Process -FilePath "$pkg\MediMart.exe" -ArgumentList "resources\server\index.js" -WorkingDirectory "$pkg\resources\server" -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\smoke\out.log" -RedirectStandardError "$env:RUNNER_TEMP\smoke\err.log" -WindowStyle Hidden
          $health = $null
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 2
            try { $health = Invoke-RestMethod "http://127.0.0.1:4791/api/health" -TimeoutSec 3 } catch { }
            if ($health) { break }
          }
          if (-not $health) { Get-Content "$env:RUNNER_TEMP\smoke\out.log", "$env:RUNNER_TEMP\smoke\err.log"; throw "Packaged server did not answer /api/health" }
          if ($health.status -ne "ok") { throw "Unexpected health payload: $($health | ConvertTo-Json -Compress)" }
          Write-Host "Packaged server health: $($health | ConvertTo-Json -Compress)"
          # The first-owner setup page must render from the packaged bundle.
          $page = Invoke-WebRequest "http://127.0.0.1:4791/" -TimeoutSec 5
          if ($page.StatusCode -ne 200 -or $page.Content -notmatch "MediMart") { throw "Packaged web bundle did not serve the app shell" }
          Stop-Process -Id $proc.Id -Force
          Write-Host "Packaged smoke test passed."
      - name: Launch the window and capture a screenshot
        continue-on-error: true # a headless runner capture is best-effort evidence, not the build
        shell: pwsh
        run: |
          $pkg = "dist/desktop/MediMart-win32-x64"
          $env:MEDIMART_DESKTOP_PORT = "4792"
          $proc = Start-Process -FilePath "$pkg\MediMart.exe" -PassThru
          Start-Sleep -Seconds 25
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $bounds = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($bounds.X, $bounds.Y, 0, 0, $bitmap.Size)
          New-Item -ItemType Directory -Force -Path screenshots | Out-Null
          $bitmap.Save("screenshots/windows-desktop.png", [System.Drawing.Imaging.ImageFormat]::Png)
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          Get-Process -Name MediMart -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Write-Host "Screenshot saved."
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: medimart-windows-dist
          path: |
            dist/desktop/MediMart-*-win-x64.zip
            dist/desktop/build-manifest.json
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: medimart-windows-screenshots
          path: screenshots/
          retention-days: 30
